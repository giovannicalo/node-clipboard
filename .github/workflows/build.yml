jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026
    steps:
    - name: Install Node
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 26.8.1
    - name: Configure Git
      run: git config --global core.autocrlf input
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Install dependencies
      run: npm install --no-fund --no-save
    - name: Lint
      run: npm run lint
name: Build
on:
- pull_request
- push
- workflow_dispatch
